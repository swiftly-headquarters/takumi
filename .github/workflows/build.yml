name: Build

on: [push, workflow_dispatch, pull_request]

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.version_step.outputs.semVer }}
      preReleaseLabel: ${{ steps.version_step.outputs.preReleaseLabel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: "5.12.x"
      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v3.2.1

  build:
    needs: versioning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Setup Node (type-checks generated TypeScript)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test
        run: |
          go vet ./...
          TAKUMI_TSC=1 go test ./...

      - name: Build and package
        run: |
          mkdir -p release
          for target in windows/amd64/win-x64 linux/amd64/linux-x64 linux/arm64/linux-arm64 darwin/arm64/osx-arm64; do
            IFS=/ read -r goos goarch rid <<< "$target"
            ext=""; [ "$goos" = windows ] && ext=".exe"
            mkdir -p "out/$rid"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-s -w" -o "out/$rid/takumi$ext" .
            (cd "out/$rid" && zip -r "$GITHUB_WORKSPACE/release/takumi-$rid.zip" .)
          done
          ls -la release

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: takumi-packages
          path: release/*.zip

  releasing:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [versioning, build]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: v${{ needs.versioning.outputs.semVer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            exit 0
          fi
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: takumi-packages
          path: ./release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip
          prerelease: ${{ needs.versioning.outputs.preReleaseLabel != '' }}
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
