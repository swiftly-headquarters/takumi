openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
servers:
  - url: https://petstore.example.com/v1
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: tags
          in: query
          style: pipeDelimited
          explode: false
          schema: { type: array, items: { type: string } }
        - name: filter
          in: query
          style: deepObject
          schema: { type: object, properties: { name: { type: string } } }
        - name: session
          in: cookie
          schema: { type: string }
      responses:
        200:
          description: A page of pets
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Pet" } }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: create-pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPet" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
    delete:
      deprecated: true
      parameters:
        - name: X-Reason
          in: header
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /pets/{petId}/photo:
    put:
      parameters:
        - name: petId
          in: path
          required: true
          style: matrix
          schema: { type: integer }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema: { type: string }
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Pet name, e.g. */Rex*" }
        tag: { type: [string, "null"] }
        status: { type: string, enum: [available, sold] }
        "x-meta": { type: object, additionalProperties: { type: string } }
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id]
          properties:
            id: { type: integer }
    Error:
      type: object
      additionalProperties: false
      properties:
        code: { type: integer }
        message: { type: string, nullable: true }
    pet-kind:
      oneOf:
        - { const: dog }
        - { const: cat }
